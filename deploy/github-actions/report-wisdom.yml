# Template: send the daily wisdom post at 09:00 Tehran time.
#
# Owner must copy this file to: .github/workflows/report-wisdom.yml
# Tehran is UTC+3:30 (Iran abolished DST in 2022), so 09:00 Tehran = 05:30 UTC.

name: Daily wisdom post

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send wisdom post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
        run: python tools/send_report.py wisdom
